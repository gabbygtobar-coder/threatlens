name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      # Public placeholders only — CI must not require a live Supabase project.
      # Real URL/anon key stay in Gabby's dashboard / local .env.local.
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://127.0.0.1:8000

  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: pytest
        run: pytest -q --tb=short
      - name: Import and /health smoke
        run: |
          python -c "from app.main import app"
          uvicorn app.main:app --host 127.0.0.1 --port 8000 &
          pid=$!
          trap 'kill $pid' EXIT
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8000/health | python -c "import sys, json; data = json.load(sys.stdin); assert data == {'status': 'ok'}, data"; then
              echo "health ok"
              exit 0
            fi
            sleep 0.2
          done
          echo "health check failed"
          exit 1

  api-docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -t threatlens-api:ci ./api
      - name: Run image and hit /health
        run: |
          docker run -d --name threatlens-api -p 8000:8000 -e RATE_LIMIT_ENABLED=false threatlens-api:ci
          trap 'docker rm -f threatlens-api' EXIT
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8000/health | python3 -c "import sys, json; data = json.load(sys.stdin); assert data == {'status': 'ok'}, data"; then
              echo "docker health ok"
              exit 0
            fi
            sleep 0.5
          done
          docker logs threatlens-api || true
          echo "docker health check failed"
          exit 1
